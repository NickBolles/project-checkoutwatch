# CheckoutWatch — Shopify app configuration.
#
# This file is the source of truth for the app's URLs, scopes, and webhook
# subscriptions. Running `shopify app deploy` pushes it to the Partner Dashboard
# and creates the webhook subscriptions on Shopify's side. Until that deploy runs,
# the webhook routes in apps/web/app/routes.ts exist but Shopify never calls them.
#
# ⚠️ DO NOT `shopify app deploy` YET. application_url below is the intended
# production host, but checkoutwatch.nickbolles.com does not point at the VPS: it
# is caught by the *.nickbolles.com wildcard CNAME (-> home.nickbolles.com,
# 134.215.117.4) and answers 404. alertproof.nickbolles.com has an explicit A
# record at 72.60.30.172 and works; CheckoutWatch needs the same record before
# this config is pushed. Deploying first points OAuth at a host that cannot serve
# it and breaks the existing install. See docs/LAUNCH_PLAN.md §8f.

# Confirmed against the deployed SHOPIFY_API_KEY on the VPS (2026-08-13) and
# against the app that actually holds the checkout-harbor-lab install.
client_id = "b56a051cd4732ba1b85aebe674206560"
name = "CheckoutWatch"
handle = "checkoutwatch"
application_url = "https://checkoutwatch.nickbolles.com"
embedded = true

[build]
include_config_on_deploy = true
# Never let `shopify app dev` rewrite the production application_url.
automatically_update_urls_on_dev = false

[access_scopes]
# Keep in lockstep with SHOPIFY_SCOPES in the deployment environment. Adding a
# scope without a product requirement is an App Store review risk.
scopes = "read_products,read_themes"

[auth]
# Both hosts are listed deliberately. The srv1073822 entries are what the live
# deployment serves today and what the existing install authenticated against;
# the nickbolles entries are what it moves to once DNS lands. Keeping both means
# the cutover is a PUBLIC_HOST change plus a container recreate, with no window
# where OAuth has no valid callback. Drop the srv1073822 entries once the move is
# done and verified.
redirect_urls = [
  "https://checkoutwatch.nickbolles.com/auth/callback",
  "https://checkoutwatch.nickbolles.com/auth/shopify/callback",
  "https://checkoutwatch.nickbolles.com/api/auth/callback",
  "https://checkoutwatch.srv1073822.hstgr.cloud/auth/callback",
  "https://checkoutwatch.srv1073822.hstgr.cloud/auth/shopify/callback",
  "https://checkoutwatch.srv1073822.hstgr.cloud/api/auth/callback",
]

[webhooks]
# Matches ApiVersion.July26 pinned in apps/web/app/shopify.server.ts.
api_version = "2026-07"

  # Synthetic traffic must stop the moment consent is withdrawn (COMPLIANCE.md).
  # This handler disables monitors, cancels queued jobs, and purges the token.
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Keeps the stored session scope in agreement with the granted scope, so the
  # library does not push merchants into a repeated authorization loop.
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # Drives entitlement reconciliation on upgrade, downgrade, and cancellation.
  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Mandatory compliance topics. App Store review checks these are registered and
  # respond correctly; CheckoutWatch stores no customer PII, so data_request
  # returns a stored-data summary and shop/redact purges the shop's rows.
  [webhooks.privacy_compliance]
  customer_data_request_url = "/webhooks/customers/data_request"
  customer_deletion_url = "/webhooks/customers/redact"
  shop_deletion_url = "/webhooks/shop/redact"

[pos]
embedded = false
